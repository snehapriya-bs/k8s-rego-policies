name: Generate policy JSON

on:
  push:
    paths:
      - "docs/*.docx"
      - "tools/doc_to_json.py"
      - "tools/llm.py"
      - "tools/smoke_test_llm.py"
      - "tools/regoforge_agent.py"
      - "tools/validate_policy.py"
      - "policy/**"
      - "manifests/**"
  pull_request:
    paths:
      - "docs/*.docx"
      - "tools/doc_to_json.py"
      - "tools/regoforge_agent.py"
      - "tools/validate_policy.py"
      - "policy/**"
      - "manifests/**"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Find source docx
        id: find_docx
        run: |
          DOCX_PATH=$(find docs -maxdepth 1 -name '*.docx' | head -n 1)
          if [ -z "$DOCX_PATH" ]; then
            echo "::error::No .docx file found in docs/"
            exit 1
          fi
          echo "path=$DOCX_PATH" >> "$GITHUB_OUTPUT"
          echo "Using source doc: $DOCX_PATH"

      - name: Generate policies.json
        run: python3 tools/doc_to_json.py "${{ steps.find_docx.outputs.path }}" policy_spec/policies.json

      - name: Upload policies.json as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: policies-json
          path: policy_spec/policies.json
          retention-days: 30

  # Confirms the runner can reach Vertex AI and get a real response from
  # Gemini. Not the full RegoForge pipeline yet (that's Step 5c-5e) — this
  # exists to catch auth/config problems early and in isolation.
  #
  # Requires two repo secrets (Settings -> Secrets and variables -> Actions):
  #   GCP_PROJECT_ID  — your GCP project ID
  #   GCP_SA_KEY      — full JSON content of a service account key with
  #                     the "Vertex AI User" (roles/aiplatform.user) role
  #
  # Skipped on pull_request events: secrets aren't available to PRs from
  # forks, so this only runs on pushes to the repo and manual dispatch.
  # Runs regoforge_agent.py's deterministic validate() against
  # policy/podsecurity.rego and every manifest in manifests/. Today that
  # file is a hand-verified baseline; from Step 5d onward it's whatever
  # RegoForge generated and passed its own retry loop before being
  # committed. This job doesn't care which — it just re-checks it.
  validate-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install opa
        run: |
          curl -L -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Validate policy against manifests
        run: python3 tools/validate_policy.py

  verify-vertex-ai:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Smoke-test Vertex AI connection
        env:
          GOOGLE_CLOUD_PROJECT: "${{ secrets.GCP_PROJECT_ID }}"
          VERTEX_LOCATION: us-central1
        run: python3 tools/smoke_test_llm.pys