name: Generate policy and Validate

on:
  push:
    paths:
      - "docs/*.docx"
      - "tools/doc_to_json.py"
      - "tools/llm.py"
      - "tools/smoke_test_llm.py"
      - "tools/regoforge_agent.py"
      - "tools/validate_policy.py"
      - "policy/**"
      - "manifests/**"
  pull_request:
    paths:
      - "docs/*.docx"
      - "tools/doc_to_json.py"
      - "tools/regoforge_agent.py"
      - "tools/validate_policy.py"
      - "policy/**"
      - "manifests/**"
  workflow_dispatch: {}

jobs:
  # Produces policy_spec/policies.json from the docx. Independent of the
  # rest of the pipeline — just an artifact for inspection.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Find source docx
        id: find_docx
        run: |
          DOCX_PATH=$(find docs -maxdepth 1 -name '*.docx' | head -n 1)
          if [ -z "$DOCX_PATH" ]; then
            echo "::error::No .docx file found in docs/"
            exit 1
          fi
          echo "path=$DOCX_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate policies.json
        run: python3 tools/doc_to_json.py "${{ steps.find_docx.outputs.path }}" policy_spec/policies.json

      - name: Upload policies.json as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: policies-json
          path: policy_spec/policies.json
          retention-days: 30

  # Step 1 of the real pipeline: policies.json -> Gemini -> validate
  # (real opa, internal retry loop) -> policy/podsecurity.rego. Uploaded
  # as an artifact only, never auto-committed.
  generate-rego:
    needs: generate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml google-genai

      - name: Install opa
        run: |
          curl -L -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Download policies.json from the generate job
        uses: actions/download-artifact@v4
        with:
          name: policies-json
          path: downloaded-json

      - name: Place it at policy_spec/policies.json
        run: |
          mkdir -p policy_spec
          find downloaded-json -name "policies.json" -exec cp {} policy_spec/policies.json \;
          test -f policy_spec/policies.json || (echo "::error::Downloaded artifact did not contain policies.json" && exit 1)

      - name: Run RegoForge agent (generate -> validate -> repair)
        env:
          GOOGLE_CLOUD_PROJECT: "${{ secrets.GCP_PROJECT_ID }}"
          VERTEX_LOCATION: us-central1
        run: python3 tools/regoforge_agent.py --policies policy_spec/policies.json --manifests manifests --out policy/podsecurity.rego --max-retries 3

      - name: Upload generated policy.rego as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-podsecurity-rego
          path: policy/podsecurity.rego
          retention-days: 30
          if-no-files-found: warn

  # Step 2: downloads the EXACT rego file generate-rego just produced
  # and independently re-validates it against every pod YAML manifest in
  # manifests/. Runs only after generate-rego succeeds.
  validate-policy:
    needs: generate-rego
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install opa
        run: |
          curl -L -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Download the freshly generated policy
        uses: actions/download-artifact@v4
        with:
          name: generated-podsecurity-rego
          path: downloaded-artifact

      - name: Place it at policy/podsecurity.rego
        run: |
          mkdir -p policy
          find downloaded-artifact -name "podsecurity.rego" -exec cp {} policy/podsecurity.rego \;
          test -f policy/podsecurity.rego || (echo "::error::Downloaded artifact did not contain podsecurity.rego" && exit 1)

      - name: Validate the generated policy against all pod YAML manifests
        run: python3 tools/validate_policy.py

  # Independent, fast sanity check that Vertex AI is reachable at all —
  # doesn't depend on the rest of the pipeline succeeding.
  verify-vertex-ai:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Smoke-test Vertex AI connection
        env:
          GOOGLE_CLOUD_PROJECT: "${{ secrets.GCP_PROJECT_ID }}"
          VERTEX_LOCATION: us-central1
        run: python3 tools/smoke_test_llm.py
