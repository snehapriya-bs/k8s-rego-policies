apiVersion: v1
kind: Pod
metadata:
  name: pol004-latest-tag
  namespace: team-a
  labels:
    team: platform
    environment: prod
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false
  volumes:
  - name: cache
    emptyDir: {}
  containers:
  - name: app
    image: registry.internal.example.com/app:latest
    securityContext:
      privileged: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
