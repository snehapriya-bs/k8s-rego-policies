apiVersion: v1
kind: Pod
metadata:
  name: pol002-runs-as-root
  namespace: team-a
  labels:
    team: platform
    environment: prod
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false
  volumes:
  - name: cache
    emptyDir: {}
  containers:
  - name: app
    image: registry.internal.example.com/app:1.4.2
    securityContext:
      privileged: false
      runAsNonRoot: false
      readOnlyRootFilesystem: true
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
