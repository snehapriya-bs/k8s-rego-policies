apiVersion: v1
kind: Pod
metadata:
  name: pol005-unapproved-registry
  namespace: team-a
  labels:
    team: platform
    environment: prod
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false
  volumes:
  - name: cache
    emptyDir: {}
  containers:
  - name: app
    image: docker.io/library/app:1.4.2
    securityContext:
      privileged: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
