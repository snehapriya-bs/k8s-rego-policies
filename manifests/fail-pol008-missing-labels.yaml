apiVersion: v1
kind: Pod
metadata:
  name: pol008-missing-labels
  namespace: team-a
  labels: {}
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false
  volumes:
  - name: cache
    emptyDir: {}
  containers:
  - name: app
    image: registry.internal.example.com/app:1.4.2
    securityContext:
      privileged: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
