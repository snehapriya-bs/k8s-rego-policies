apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: team-a
  labels:
    team: platform
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      volumes:
        - name: cache
          emptyDir: {}
      containers:
        - name: app
          image: registry.internal.example.com/web-frontend:1.4.2
          securityContext:
            privileged: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
