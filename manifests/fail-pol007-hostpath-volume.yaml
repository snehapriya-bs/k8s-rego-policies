apiVersion: v1
kind: Pod
metadata:
  name: pol007-hostpath-volume
  namespace: team-a
  labels:
    team: platform
    environment: prod
spec:
  hostNetwork: false
  hostPID: false
  hostIPC: false
  volumes:
  - name: node-fs
    hostPath:
      path: /etc
  containers:
  - name: app
    image: registry.internal.example.com/app:1.4.2
    securityContext:
      privileged: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
